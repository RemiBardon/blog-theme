{{- with $translations := . }}{{/* Expects `.Page.Translations` */}}
<ul class="lang-switch">
  {{- range $translations }}
  <li>
    <a
      href="{{ .Permalink }}"
      title="{{ .Language.Params.languageAltTitle | default (.Language.Label | emojify) | default (.Lang | title) }}"
      aria-label="{{ .Language.Label | default (.Lang | title) }}"
    >
      {{- if (and site.Params.displayFullLangName .Language.Label) }}
        {{- .Language.Label | emojify }}
      {{- else }}
        {{- .Lang | title }}
      {{- end }}
    </a>
  </li>
  {{- end }}
</ul>
{{- end -}}
